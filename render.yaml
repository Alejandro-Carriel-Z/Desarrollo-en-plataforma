# Blueprint de Render para SecureGuard (Unidad 8).
# Render → New → Blueprint → este repositorio. Los secretos (sync: false) se piden en el panel.
# Producción: https://secureguard-bb1a.onrender.com
services:
  - type: web
    name: secureguard
    runtime: node
    plan: free
    region: oregon
    rootDir: SEMANA 8
    buildCommand: npm ci
    # Migraciones + seed idempotente + servidor (el plan free no tiene shell ni pre-deploy).
    startCommand: npm run start:prod
    healthCheckPath: /api/salud
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HTTPS_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: secureguard-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://secureguard-bb1a.onrender.com
      - key: SEED_ANALISTA_PASSWORD
        sync: false
      - key: SEED_SUPERVISOR_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: secureguard-db
    plan: free
    region: oregon
    databaseName: secureguard
    user: secureguard
    postgresMajorVersion: "16"
