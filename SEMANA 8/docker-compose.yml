# Entorno completo local tipo producción: app + PostgreSQL 16.
# Uso: crea .env con POSTGRES_PASSWORD, JWT_SECRET y SEED_*_PASSWORD; luego
#   docker compose up -d --build
# (el seed corre solo al arrancar si las SEED_* están definidas)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: secureguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: secureguard
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureguard -d secureguard"]
      interval: 10s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HTTPS_ENABLED: "false"
      TRUST_PROXY: "false"
      DATABASE_URL: postgresql://secureguard:${POSTGRES_PASSWORD}@db:5432/secureguard
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      CORS_ORIGINS: http://localhost:8080
      SEED_ANALISTA_PASSWORD: ${SEED_ANALISTA_PASSWORD:-}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "8080:3000"
volumes:
  datos-postgres:
